<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="WF16 Carrera de números"><title>Carrera de números</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect x="1" y="1" width="998" height="648" rx="22" fill="#fbfbfb" stroke="#777" stroke-width="1.5"/><text x="32" y="49" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#222">edukids</text><text x="750" y="46" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#222">Wireframe E2</text><line x1="30" y1="75" x2="970" y2="75" stroke="#555" stroke-width="2"/><text x="40" y="126" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#222">Llega del 2 al 10</text><rect x="700" y="552" width="260" height="64" rx="12" fill="#fff" stroke="#444444" stroke-width="1.5"/><text x="720" y="592" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Volver</text><text x="75" y="210" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#222">Empiezas en 2. Elige el primer paso.</text><text x="75" y="270" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#222">2  →  [   ]  →  10</text><rect x="90" y="350" width="340" height="64" rx="12" fill="#dedede" stroke="#444444" stroke-width="1.5"/><text x="110" y="390" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Sumar 3</text><rect x="500" y="350" width="340" height="64" rx="12" fill="#fff" stroke="#444444" stroke-width="1.5"/><text x="520" y="390" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Sumar 9</text><rect x="40" y="552" width="275" height="64" rx="12" fill="#fff" stroke="#444444" stroke-width="1.5"/><text x="60" y="592" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Pausa</text><text x="85" y="470" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#222">En la aplicación, cada paso cambia el número actual.</text><a href="#WF03" aria-label="Volver"><rect x="700" y="552" width="260" height="64" fill="transparent"/></a><a href="#WF08" aria-label="Sumar 3"><rect x="90" y="350" width="340" height="64" fill="transparent"/></a><a href="#WF06" aria-label="Sumar 9"><rect x="500" y="350" width="340" height="64" fill="transparent"/></a><a href="#WF07" aria-label="Pausa"><rect x="40" y="552" width="275" height="64" fill="transparent"/></a></svg>