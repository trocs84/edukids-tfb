<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="WF04 Instrucciones de Atrapa el número"><title>Instrucciones de Atrapa el número</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><rect x="1" y="1" width="998" height="648" rx="22" fill="#fbfbfb" stroke="#777" stroke-width="1.5"/><text x="32" y="49" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#222">edukids</text><text x="750" y="46" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#222">Wireframe E2</text><line x1="30" y1="75" x2="970" y2="75" stroke="#555" stroke-width="2"/><text x="40" y="126" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#222">Atrapa el número</text><rect x="700" y="552" width="260" height="64" rx="12" fill="#fff" stroke="#444444" stroke-width="1.5"/><text x="720" y="592" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Volver</text><text x="80" y="210" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222">Mira la operación.</text><text x="80" y="272" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222">Toca la respuesta que elijas.</text><text x="80" y="334" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222">Puedes pedir una pista.</text><text x="80" y="396" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222">Son cinco retos. Puedes parar.</text><rect x="40" y="552" width="260" height="64" rx="12" fill="#dedede" stroke="#444444" stroke-width="1.5"/><text x="60" y="592" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Empezar</text><rect x="340" y="552" width="265" height="64" rx="12" fill="#fff" stroke="#444444" stroke-width="1.5"/><text x="360" y="592" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222">Ver ayuda</text><a href="#WF03" aria-label="Volver"><rect x="700" y="552" width="260" height="64" fill="transparent"/></a><a href="#WF05" aria-label="Empezar"><rect x="40" y="552" width="260" height="64" fill="transparent"/></a><a href="#WF06" aria-label="Ver ayuda"><rect x="340" y="552" width="265" height="64" fill="transparent"/></a></svg>